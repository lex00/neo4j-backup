# Demo backup policy. The db_group is the policy + PITR-alignment unit (DESIGN.md §2);
# `tenant` is an optional label (#102). Applications connect to ALIASES; physical database
# names are generated by the naming authority (bootstrap/naming.sh) and repointed on
# restore. The orchestrator (next layer) loads and validates this file.

# Customer types (#101): a group names a profile and overrides only what differs. A profile may
# set any group field except id, aliases, databases and overrides; `load:` merges per key.
# The `load:` paths are described in POLICY.md (#103). A group on data-interval or data-scratch
# adds its own `load.build` (and `load.source`), since each customer builds different data.
profiles:
  app-live:       { tier: gold, retention_days: 14 }
  data-interval:  { tier: nightly, load: { mode: rebuild, writes: read-only, keep_loads: 14 } }
  data-scratch:   { tier: nightly, load: { mode: rebuild, writes: read-write, protect_writes: false, keep_loads: 7 } }
  data-then-live: { tier: gold, load: { mode: once, writes: read-write, protect_writes: true } }

db_groups:
  - id: demo
    tenant: acme                 # a label for selecting this customer's groups (#102); not access control
    # Stable app-facing aliases. Neo4j's full alias charset is allowed (teams keep
    # their existing names); the naming authority derives db-legal slugs + timestamps
    # for the physical databases and storage prefixes.
    aliases:
      - acme-orders
      - acme-graph
      - acme-audit
    tier: gold
    retention_days: 7
    rpo_minutes: 60
    rto_minutes: 120
    # Server-side SSE-KMS (DESIGN.md "Backup-file encryption"): per-group key = the
    # bucket's default KMS key, read transparently by seed-from-URI restore. Local dev
    # stands in with the floci emulator's KMS key alias/<KMS_KEY_NAME> (see STACK.md).
    encryption:
      mode: sse-kms
      kms_key_ref: demo-group-key   # cloud KMS key id/alias; local: floci key alias name
    # Seed topology (DESIGN.md §3): the cluster shape a restore/bulk-import seeds into,
    # so recovery keeps its redundancy instead of the DBMS default. OMITTED here because
    # the local stack is single-node — the TOPOLOGY clause is illegal on standalone. On a
    # cluster, uncomment:
    #   topology: { primaries: 3, secondaries: 0 }
    overrides: {}                   # per-alias cadence / topology overrides (optional)

tiers:
  gold:   { full_cron: "0 2 * * *",   diff_cron: "0 * * * *" }    # daily full, hourly diff
  silver: { full_cron: "0 3 * * 0",   diff_cron: "0 */6 * * *" }  # weekly full, 6h diff
  bronze: { full_cron: "0 4 * * 0",   diff_cron: "0 0 * * *" }    # weekly full, daily diff
  nightly: { rebuild_cron: "0 1 * * *" }                          # load-only groups: rebuild nightly
