site_name: Neo4j Policy-Based Backup / Restore
site_description: Policy-driven backup and restore for self-hosted Neo4j Enterprise, run from Dagster, Airflow or the CLI
# The markdown lives at the repo root (for GitHub); `mkdocs-stage.sh` copies the curated
# set into docs/ for the build. Run `just docs` (or the Pages workflow).
docs_dir: docs
site_dir: _site
use_directory_urls: true

repo_url: https://github.com/lex00/neo4j-backup
repo_name: lex00/neo4j-backup

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - content.code.copy
    - content.tabs.link
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - search.suggest
    - search.highlight
    - toc.follow

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Start:
    - Getting started: GETTING-STARTED.md
    - Connect an agent: MCP.md
    - Set up:
      - Deploy on Dagster: orchestrator/deploy/DEPLOY.md
      - Dagster: orchestrator/README.md
      - Airflow: airflow/README.md
      - CI and cron: CI.md
    - Customer guide: CUSTOMERS.md
    - Glossary: GLOSSARY.md
  - Workflows:
    - Overview: OPERATOR.md
    - Onboard a customer: workflows/onboard.md
    - Check coverage: workflows/coverage.md
    - Restore on request: workflows/restore.md
    - Load data in bulk: workflows/load.md
    - Change or offboard: workflows/change.md
    - Recover or move: workflows/recover.md
  - Reference:
    - Policy: POLICY.md
    - Policy fields: POLICY-FIELDS.md
    - Environment variables: ENVIRONMENT.md
    - Recovery and Cypher: RECOVERY.md
    - Bulk import: IMPORT.md
    - CLI contract: CLI-CONTRACT.md
  - Project:
    - Local stack: STACK.md
    - Design notes: DESIGN.md
    - Diagrams: diagrams/README.md
    - Changelog: CHANGELOG.md

markdown_extensions:
  - admonition
  - tables
  - def_list
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
